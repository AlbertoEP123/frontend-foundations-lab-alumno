<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 22 - Alberto Enrique Pulido</title>
</head>

<body>
    <form>
        <fieldset class="fieldSetContenedor">
            <legend>Filtros de productos</legend>

            <label for="search">Buscar</label>
            <input id="search" name="search" type="search" minlength="3" required>

            <label for="category">Categoría</label>
            <select id="category" name="category">
                <option value="">Todas</option>
            </select>

            <label for="sort">Ordenar por</label>
            <select id="sort" name="sort">
                <option value="name">Nombre</option>
                <option value="name">Precio</option>
                <option value="name">Stock</option>
                <option value="name">Valoracion</option>


            </select>

            <label for="direction">Dirección</label>
            <select id="direction" name="direction">
                <option value="asc">Ascendente</option>
                <option value="desc">Descendente</option>
            </select>

            <button type="reset">Limpiar</button>
            <button type="button" id="openModal">Nuevo producto</button>
        </fieldset>
    </form>
    <p id="listStatus" role="status" aria-live="polite"></p>
    <section class="tablaProductos">
        <table>
            <thead>
                <tr>
                    <th scope="col">Nombre producto</th>
                  <th scope="col">Categoría</th>
                    <th scope="col">Precio</th>
                  <th scope="col">Stock</th>
                  <th scope="col">Acciones</th>
                </tr>
            </thead>
            <tbody data-table-datos></tbody>
        </table>
    </section>
    <div id="myModal" class="modal">
        <div class="modal-content">
            <div>
                <h3>Nuevo producto</h3>
                <span class="close">&times;</span>
            </div>
            <form id="productForm">
                <label for="nombreProducto">Nombre producto</label>
                <input id="nombreProducto" name="name" type="text" required>
                <label for="categoriaProducto">Categoría</label>
                <input id="categoriaProducto" name="category" type="text" required>
                <label for="precioProducto">Precio</label>
                <input id="precioProducto" name="price" type="number" min="0" step="0.01" required>
                <label for="stockProducto">Stock</label>
                <input id="stockProducto" name="stock" type="number" min="0" step="1" required>
                <button type="submit">Añadir producto</button>
            </form>
        </div>
    </div>
</body>

</html>
