<!doctype html>
<html lang="es" data-exercise-id="02-html-accessible-form" data-exercise-title="02 · Formulario accesible">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter · Formulario accesible</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/exercise-shell.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="/shared/exercise-nav.mjs"></script>
</head>

<body>
  <main class="container exercise-shell">
    <section class="exercise-intro card">
      <p>HTML y accesibilidad</p>
      <h1>Alta en el programa de formacion</h1>
      <p class="todo-note">Completa la semantica, tipos, restricciones, ayudas y agrupaciones del formulario.</p>
    </section>

    <section class="exercise-workspace card">
      <form class="registration-form" action="#success" method="get">

        <div class="field">
          <label for="fullName">Nombre completo</label>
          <input type="text" name="fullName" id="fullName" placeholder="Ej. Andrea Garcia" autocomplete="name" minlength="2" required>
        </div>

        <div class="field">
          <label for="email">Correo corporativo</label>
          <input type="email" name="email" id="email" placeholder="correo@gmail.com" autocomplete="email" aria-describedby="email-hint" required>
          <p class="field__hint" id="email-hint">Usaremos esta direccion para las convocatorias.</p>
        </div>

        <div class="field">
          <label for="startDate">Fecha de incorporacion</label>
          <input type="date" name="startDate" id="startDate" required>
        </div>

        <div class="field">
          <label for="experience">Nivel de experiencia</label>
          <select name="experience" id="experience" required>
            <option value="" selected disabled>Selecciona una opción</option>
            <option value="Sin experiencia" label="Sin experiencia">Sin experiencia</option>
            <option value="Menos de un año" label="Menos de un año">Menos de un año</option>
            <option value="Uno a tres años" label="Uno a tres años">Uno a tres años</option>
          </select>
        </div>

        <fieldset class="options">
          <legend>Disponibilidad preferida</legend>
          <label><input type="radio" name="schedule" value="morning" required> Mañana</label>
          <label><input type="radio" name="schedule" value="afternoon"> Tarde</label>
        </fieldset>

        <div class="options">
          <label><input type="checkbox" name="terms" required> Acepto las normas del programa</label>
        </div>

        <button class="fake-submit" type="submit">Enviar solicitud</button>
      </form>
    </section>
  </main>
</body>

</html>
