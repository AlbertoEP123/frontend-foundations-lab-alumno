<!doctype html>
<html lang="es" data-exercise-id="03-html-table-navigation" data-exercise-title="03 · Tabla de datos y navegacion">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starter · Tabla de datos</title>
    <link rel="stylesheet" href="/shared/base.css">
    <link rel="stylesheet" href="/shared/exercise-shell.css">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="/shared/exercise-nav.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#inventory">Saltar al inventario</a>
    <main class="container exercise-shell">
      <section class="exercise-intro card">
        <h1>Inventario</h1>
        <p>Convierte este listado visual en una tabla de datos accesible.</p>
      </section>

      <section class="exercise-workspace card">
        <table class="data-grid" id="inventory" tabindex="-1">
          <caption>Inventario</caption>
          <thead>
            <tr class="row row--header">
              <th scope="col">Producto</th><th scope="col">Categoría</th><th scope="col">Stock</th><th scope="col">Estado</th><th scope="col">Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr class="row">
              <th scope="row">Teclado mecánico</th><td>Periféricos</td><td>18</td><td class="status status--ok">Disponible</td><td><button type="button">Editar</button></td>
            </tr>
            <tr class="row">
              <th scope="row">Monitor 27 pulgadas</th><td>Monitores</td><td>2</td><td class="status status--warning">Stock bajo</td><td><button type="button">Editar</button></td>
            </tr>
            <tr class="row">
              <th scope="row">Webcam Full HD</th><td>Vídeo</td><td>0</td><td class="status status--danger">Agotado</td><td><button type="button">Editar</button></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
